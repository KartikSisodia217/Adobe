<!DOCTYPE html>
<html>
<head>
    <title>Schema Conflict Example</title>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org/",
      "@type": "Product",
      "name": "Conflict Widget",
      "offers": {
        "@type": "Offer",
        "price": "59.00",
        "priceCurrency": "USD"
      }
    }
    </script>
</head>
<body>
    <main>
        <h1>Conflict Widget</h1>
        <p>Price: $49.00</p>
    </main>
</body>
</html>
