<!DOCTYPE html>
<html>
<head>
    <title>Newsletter</title>
</head>
<body>
    <div id="modal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999;" role="dialog" aria-modal="true">
        <div style="background: white; padding: 20px; margin: 100px;">
            <h2>Subscribe</h2>
            <button id="close-btn" onclick="document.getElementById('modal').style.display='none'">Close</button>
        </div>
    </div>
    <div id="content">
        <h1>Welcome</h1>
        <p>This is the main content.</p>
        <a href="/about">About Us</a>
    </div>
    <script>
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                document.getElementById('modal').style.display = 'none';
            }
        });
    </script>
</body>
</html>
