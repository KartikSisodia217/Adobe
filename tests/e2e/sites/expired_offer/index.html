<!DOCTYPE html>
<html>
<head>
  <title>Expired Offer</title>
</head>
<body>
  <h1>Expired Offer</h1>
  <p>Product price: $100.00</p>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Product",
    "name": "Expired Product",
    "offers": {
      "price": "100.00",
      "priceCurrency": "USD",
      "priceValidUntil": "2020-01-01"
    }
  }
  </script>
</body>
</html>
