<!DOCTYPE html>
<html>
<head>
    <title>SaaS Pricing</title>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Product",
      "name": "Pro Plan",
      "offers": {
        "@type": "Offer",
        "price": "499.00",
        "priceCurrency": "USD",
        "description": "per year"

</head>
<body>
    <h1>Pricing</h1>
    <div class="pricing-card">
        <h2>Pro Plan</h2>
        <p class="price">$49.00 / month</p>
    </div>
</body>
</html>
